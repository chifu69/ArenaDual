<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#07111f" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
<title>Arena Duel v0.4.2</title>
</head>
<body>
<div id="app">
  <header class="hud-top">
    <div class="player blue"><strong>EAGLE</strong><span id="scoreBlue">0</span></div>
    <div class="timer-wrap"><div id="timer">100</div><small id="modeLabel">FIRST TO 10</small><button id="soundBtn" aria-label="Toggle sound" title="Sound">🔊</button></div>
    <div class="player orange"><strong>SHADOW</strong><span id="scoreOrange">0</span></div>
  </header>

  <section class="battle-meta">
    <div>LEVEL <b id="levelValue">1</b></div>
    <div>MODE <b id="difficultyValue">MEDIUM</b></div>
    <div>🔥 STREAK <b id="streakValue">0</b></div>
    <div>WEAPON <b id="weaponValue">SINGLE</b></div>
  </section>

  <section id="difficultyPanel" class="difficulty-panel" aria-label="Difficulty selector">
    <button class="difficulty-btn" data-difficulty="easy">EASY</button>
    <button class="difficulty-btn" data-difficulty="medium">MEDIUM</button>
    <button class="difficulty-btn" data-difficulty="hard">HARD</button>
  </section>

  <main>
    <canvas id="game" width="900" height="1400" aria-label="Arena Duel game"></canvas>
    <div id="message" class="message hidden"></div>
    <div id="toast" class="toast"></div>
  </main>

  <section class="controls">
    <div class="joystick" id="movePad" aria-label="Movement joystick">
      <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="actions">
      <button id="dashBtn">DASH</button>
      <button id="fireBtn" class="fire">FIRE</button>
    </div>
  </section>

  <footer>
    <button id="startBtn">START DUEL</button>
    <span>Arena Duel v0.4.2 • Arcade Sound • 100 Seconds</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
